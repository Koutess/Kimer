name: Build Kimer APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate icons and splash screen
        run: npx capacitor-assets generate --android

      - name: Apply native tweaks (landscape, fullscreen, keep awake)
        run: |
          cp android-overrides/MainActivity.java android/app/src/main/java/com/kimer/app/MainActivity.java
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape" android:resizeableActivity="false"|' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kimer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
