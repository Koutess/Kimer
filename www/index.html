<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Kimer</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#fff;--dim:#7a7a7a;--line:#1b1b1b;--card:#101010;--acc:var(--fg)}
:root.light{color-scheme:light;--bg:#fff;--fg:#000;--dim:#8c8c8c;--line:#e6e6e6;--card:#f2f2f2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
 font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900}
#track{position:relative;z-index:1;display:flex;width:500%;height:100%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.panel{width:20%;height:100%;position:relative;overflow:hidden}
/* clock */
#drift{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform 25s ease-in-out}
#time{font-size:33vw;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
#time small{font-size:8vw;color:var(--acc);letter-spacing:0;margin-left:1.5vw}
.dg{display:inline-block;min-width:.62em;text-align:center}
.dg.roll{animation:roll .55s cubic-bezier(.2,.8,.2,1)}
.cn{display:inline-block;transform:translateY(-.04em);animation:blink 2s ease-in-out infinite}
#time{animation:enter 1.1s cubic-bezier(.2,.8,.2,1) both}
#date{animation:enter 1.1s .2s cubic-bezier(.2,.8,.2,1) both}
#wx{animation:enter 1.1s .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes roll{from{transform:translateY(.28em);opacity:0}to{transform:none;opacity:1}}
@keyframes blink{50%{opacity:.3}}
@keyframes enter{from{opacity:0;transform:translateY(2vh) scale(.96)}}
@keyframes thump{50%{transform:scale(1.07)}}
#ring.on h1{animation:thump 1s ease-in-out infinite}
#date{font-size:5vw;margin-top:2vh;color:var(--dim);letter-spacing:-.01em}
#wx{position:absolute;left:0;right:0;bottom:7vh;display:flex;justify-content:center;align-items:center;gap:2vw;font-size:4vw;color:var(--fg)}
#wx svg{width:7vw;height:7vw;overflow:visible}
#wx span{color:var(--dim);font-size:3vw}
.hint{position:absolute;bottom:2vh;width:100%;text-align:center;font-size:1.6vw;color:#555}
#dots{position:fixed;top:2vh;left:0;right:0;display:flex;justify-content:center;gap:1.2vw;z-index:5}
#dots i{width:1.1vw;height:1.1vw;border-radius:50%;background:var(--line);transition:.3s}
#dots i.on{background:var(--acc);transform:scale(1.25)}
/* ambient + fx */
#amb,#fx{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;pointer-events:none;z-index:0}
#amb i{position:absolute;width:60vw;height:60vw;border-radius:50%;background:radial-gradient(circle,var(--acc) 0%,transparent 62%);opacity:.07;animation:orb 28s ease-in-out infinite alternate;will-change:transform}
#amb i:nth-child(1){left:-18vw;top:-24vw}
#amb i:nth-child(2){right:-22vw;bottom:-30vw;animation-duration:36s;animation-delay:-9s}
@keyframes orb{to{transform:translate(12vw,8vh) scale(1.25)}}
.noamb #amb{display:none}.nosec #time small{display:none}.nowx #wx{display:none}
#greet{font-size:2.6vw;color:var(--acc);margin-top:1.2vh;animation:enter 1s .3s cubic-bezier(.2,.8,.2,1) both}
#prog{position:absolute;left:8vw;right:8vw;bottom:3vh;height:.55vh;background:var(--line);border-radius:1vh;overflow:hidden}
#prog i{display:block;height:100%;width:100%;background:var(--acc);border-radius:inherit;transform:scaleX(0);transform-origin:0 50%;animation:pg 60s linear infinite}
@keyframes pg{to{transform:scaleX(1)}}
#wx{bottom:8vh}
/* panel entrance */
.panel.act .pad>*{animation:enter .7s cubic-bezier(.2,.8,.2,1) both}
.panel.act .pad>*:nth-child(2){animation-delay:.08s}.panel.act .pad>*:nth-child(3){animation-delay:.16s}
.al.new{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
.al.gone{animation:gone .3s ease-in forwards}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(3vh)}}
@keyframes gone{to{opacity:0;transform:translateX(8vw) scale(.95)}}
/* ring ripples */
#ring{overflow:hidden}#ring h1,#ring .btns{position:relative}
.rp{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.rp i{position:absolute;left:50%;top:50%;width:20vw;height:20vw;margin:-10vw;border:.6vw solid var(--bg);border-radius:50%;opacity:0}
#ring.on .rp i{animation:ripple 3s ease-out infinite}
.rp i:nth-child(2){animation-delay:1s!important}.rp i:nth-child(3){animation-delay:2s!important}
@keyframes ripple{0%{transform:scale(.3);opacity:.5}100%{transform:scale(7);opacity:0}}
/* focus */
.focus{display:flex;align-items:center;justify-content:center;gap:7vw;height:calc(100% - 9vh)}
.ringbox{position:relative;width:46vh;height:46vh}
.ringbox.flash{animation:thump .9s}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--line);stroke-width:6}
.arc{fill:none;stroke:var(--acc);stroke-width:6;stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:0;transition:stroke-dashoffset .3s linear,stroke .6s}
.arc.brk{stroke:var(--dim)}
.pc{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh}
.pc .big{font-size:11vh}#pmode{font-size:2.6vh;color:var(--dim)}
.pside{display:flex;flex-direction:column;align-items:center}
#pdots{display:flex;gap:1.4vh;margin-bottom:3.5vh}
#pdots i{width:2.4vh;height:2.4vh;border-radius:50%;background:var(--line);transition:background .4s,transform .45s cubic-bezier(.2,1.4,.4,1)}
#pdots i.on{background:var(--acc);transform:scale(1.25)}
/* settings */
.tg{cursor:pointer}
.sws{display:flex;gap:2.4vw;margin:1vh 0 4vh}
.sws b{width:7vw;height:7vw;border-radius:50%;border:.5vw solid transparent;transition:transform .3s cubic-bezier(.2,1.4,.4,1),border-color .3s}
.sws b.on{transform:scale(1.18);border-color:var(--fg)}
.set .tg{font-size:2.6vw;color:var(--fg);margin-bottom:2.4vh}
.ver{font-size:1.8vw;color:var(--dim);margin-top:3vh}
.br{margin-top:1vh}.br span{display:block;font-size:2.6vw;margin-bottom:2vh}
input[type=range]{-webkit-appearance:none;width:42vw;height:1.4vw;border-radius:1vw;background:var(--line);outline:0;touch-action:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:4.4vw;height:4.4vw;border-radius:50%;background:var(--acc)}
#drift{padding-bottom:7vh}
#bat,#nxt{position:absolute;top:3.2vh;font-size:2vw;color:var(--dim)}#bat{left:3vw}#nxt{right:3vw}
#quote{font-size:2.1vw;color:var(--dim);margin-top:1.6vh;max-width:70vw;text-align:center;animation:enter 1s .5s cubic-bezier(.2,.8,.2,1) both}
.nobat #bat,.nonxt #nxt,.noquote #quote{display:none}
.tgs{display:flex;flex-wrap:wrap}.tgs .tg{width:50%}
/* momenten */
.sm{fill:none;stroke:var(--fg);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.fg{fill:var(--fg)}.sm.f,.f{fill:var(--bg)}
#scene{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:18;display:none;align-items:center;justify-content:center;gap:4vw;opacity:0;transition:opacity .6s}
#scene.on{display:flex}#scene.show{opacity:1}
#sart{animation:enter .9s cubic-bezier(.2,.8,.2,1) both}#sart svg{width:56vw;height:auto;max-height:82vh;display:block}
#stxt{width:34vw}#stime{font-size:11vw;line-height:1;letter-spacing:-.03em;animation:enter .9s .2s cubic-bezier(.2,.8,.2,1) both}
#smsg{font-size:3.3vw;margin-top:2vh;color:var(--dim);line-height:1.2;animation:enter .9s .45s cubic-bezier(.2,.8,.2,1) both}
#sbar{position:absolute;left:8vw;right:8vw;bottom:3.5vh;height:.6vh;background:var(--line);border-radius:1vh;overflow:hidden}
#sbar i{display:block;height:100%;background:var(--fg);transform-origin:0 50%;animation:pg 15s linear forwards}
#scene.hold #sbar{display:none}
#ring.on.alarm{background:transparent;color:var(--fg);justify-content:flex-end;padding-bottom:5vh;gap:2vh}
#ring.alarm h1{font-size:4.5vw}#ring.alarm .rp{display:none}#ring.alarm .btn{background:var(--fg);color:var(--bg)}
.mh{font-size:3vw;margin:3.5vh 0 2vh}
.mr{display:flex;align-items:center;gap:2vw;margin-bottom:1.6vh;background:var(--card);border-radius:1.4vw;padding:1.2vh 2vw}
.mr span{flex:1;font-size:2.4vw}.mr input[type=time]{background:none;border:0;font-size:2.8vw;width:21vw;color:var(--fg)}
.mr .btn{font-size:2vw;padding:1vh 1.6vw}
/* weather icons */
.sun-r{transform-origin:50% 50%;animation:spin 18s linear infinite}
.cl{animation:drift 6s ease-in-out infinite alternate}
.dr{animation:fall 1.1s linear infinite}.dr:nth-child(2){animation-delay:.35s}.dr:nth-child(3){animation-delay:.7s}
.fg{animation:pulse 3s ease-in-out infinite alternate}.fg:nth-child(2){animation-delay:1s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{to{transform:translateX(5px)}}
@keyframes fall{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(12px);opacity:0}}
@keyframes pulse{to{opacity:.3;transform:translateX(4px)}}
/* generic panels */
.pad{padding:7vh 5vw 4vh;height:100%;overflow-y:auto;touch-action:pan-y}
h2{margin:0 0 2.5vh;font-size:4vw}
button,input{font:inherit;color:inherit}
.btn{background:var(--line);border:0;border-radius:1.2vw;padding:1.6vh 2.4vw;font-size:2.4vw;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--bg)}
.btn:active{transform:scale(.96)}
/* alarms */
.al{display:flex;align-items:center;gap:2vw;background:var(--card);border-radius:1.6vw;padding:1.6vh 2vw;margin-bottom:1.6vh}
.al input[type=time]{background:none;border:0;font-size:5vw;width:19vw;color:var(--fg)}
.al.off input[type=time]{color:var(--dim)}
.days{display:flex;gap:.6vw;flex:1}
.days b{width:3.6vw;height:3.6vw;border-radius:50%;display:grid;place-items:center;font-size:1.7vw;background:var(--line);color:var(--dim)}
.days b.on{background:var(--acc);color:var(--bg)}
.sw{transition:background .25s;width:7vw;height:3.8vw;border-radius:2vw;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:.4vw;left:.4vw;width:3vw;height:3vw;border-radius:50%;background:var(--dim);transition:.25s}
.sw.on{background:var(--acc)}.sw.on::after{left:3.6vw;background:var(--bg)}
.del{background:none;border:0;color:var(--dim);font-size:3vw;padding:0 1vw}
.row{display:flex;gap:2vw;align-items:center;margin-top:2vh}
.tg{display:flex;align-items:center;gap:1.5vw;font-size:2.2vw;color:var(--dim)}
/* timer */
.cols{display:flex;gap:4vw;height:calc(100% - 9vh)}
.col{flex:1;background:var(--card);border-radius:2vw;padding:3vh 2.5vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh}
.big{font-size:11vw;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.big.run{color:var(--acc)}
.btns{display:flex;gap:1.2vw;flex-wrap:wrap;justify-content:center}
/* overlays */
#start,#ring{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:4vh;z-index:20;text-align:center}
#start{display:flex}#ring.on{display:flex;background:var(--acc);color:var(--bg)}
#start h1{font-size:16vw;margin:0;letter-spacing:-.04em}
#start p{font-size:3vw;color:var(--dim);margin:0}
#ring h1{font-size:12vw;margin:0}
#ring .btn{background:var(--bg);color:var(--fg);font-size:3.4vw;padding:2.5vh 4vw}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="start" onclick="boot()"><h1>Kimer</h1><p>Tik om te starten</p></div>
<div id="ring"><div class="rp"><i></i><i></i><i></i></div><h1 id="rl">Wekker</h1><div class="btns"><button class="btn" onclick="snooze()">Snooze 9 min</button><button class="btn" onclick="stopRing()">Stop</button></div></div>
<div id="scene" onclick="tapScene()"><div id="sart"></div><div id="stxt"><div id="stime"></div><div id="smsg"></div></div><div id="sbar"><i></i></div></div>
<div id="dots"><i class="on"></i><i></i><i></i><i></i><i></i></div>

<div id="amb"><i></i><i></i></div><canvas id="fx"></canvas>
<div id="track">
 <section class="panel">
  <div id="drift">
   <div id="time"><span class="dg"></span><span class="dg"></span><span class="cn">:</span><span class="dg"></span><span class="dg"></span><small><span class="dg"></span><span class="dg"></span></small></div>
   <div id="date"></div><div id="greet"></div><div id="quote"></div>
  </div>
  <div id="bat"></div><div id="nxt"></div><div id="wx"></div>
  <div id="prog"><i></i></div><div class="hint" id="hint"></div>
 </section>
 <section class="panel"><div class="pad">
  <h2>Wekkers</h2><div id="alarms"></div>
  <div class="row"><button class="btn pri" onclick="addAlarm()">+ Wekker</button>
   <div class="tg" onclick="toggleGentle()"><div class="sw" id="gsw"></div>Rustig wakker worden (volume loopt 60 sec op)</div></div>
 </div></section>
 <section class="panel"><div class="pad">
  <h2>Timer &amp; stopwatch</h2>
  <div class="cols">
   <div class="col"><div class="big" id="tdisp">05:00</div>
    <div class="btns"><button class="btn" onclick="tAdd(60)">+1</button><button class="btn" onclick="tAdd(300)">+5</button><button class="btn" onclick="tAdd(600)">+10</button></div>
    <div class="btns"><button class="btn pri" id="tgo" onclick="tToggle()">Start</button><button class="btn" onclick="tReset()">Reset</button></div></div>
   <div class="col"><div class="big" id="sdisp">00:00.0</div>
    <div class="btns"><button class="btn pri" id="sgo" onclick="sToggle()">Start</button><button class="btn" onclick="sReset()">Reset</button></div></div>
  </div>
 </div></section>
<section class="panel"><div class="pad">
  <h2>Focus</h2>
  <div class="focus">
   <div class="ringbox" id="rbox"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52"/><circle id="parc" class="arc" cx="60" cy="60" r="52"/></svg>
    <div class="pc"><div class="big" id="pdisp">25:00</div><div id="pmode">Focus</div></div></div>
   <div class="pside"><div id="pdots"><i></i><i></i><i></i><i></i></div>
    <div class="btns"><button class="btn pri" id="pgo" onclick="pToggle()">Start</button><button class="btn" onclick="pSkip()">Sla over</button><button class="btn" onclick="pReset()">Reset</button></div></div>
  </div>
 </div></section>
 <section class="panel"><div class="pad set">
  <h2>Instellingen</h2><div id="setbox"></div><div class="ver">Kimer 1.4</div>
 </div></section>
</div>

<script>
const $=s=>document.querySelector(s), p2=n=>String(n).padStart(2,'0');
const LAT=53.24, LON=6.33;           // weerlocatie: Niezijl
let S={alarms:[],gentle:true,ev:{},mom:true,msnd:true,light:false,bat:true,nxt:true,quote:false,tap:false,amb:true,fx:true,sec:true,wx:true,bright:0};
try{S=Object.assign(S,JSON.parse(localStorage.kimer||'{}'))}catch(e){}
const save=()=>{try{localStorage.kimer=JSON.stringify(S)}catch(e){}};

/* ---------- start, fullscreen, wake lock, audio ---------- */
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
let ctx,lock;
if(NATIVE){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function boot(){
  $('#start').style.display='none';
  try{(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement)}catch(e){}
  try{ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}
  wake();
}
async function wake(){
  try{ if(!lock||lock.released){lock=await navigator.wakeLock.request('screen')} }catch(e){}
  $('#hint').textContent=(NATIVE||(lock&&!lock.released))?'':'Scherm-aan niet beschikbaar: zet "Actief laten" aan in Ontwikkelaarsopties';
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});
setInterval(()=>{if(!$('#start').style.display||$('#start').style.display==='none')wake()},30000);

/* ---------- swipe ---------- */
let idx=0,x0=null,y0=0;
function go(i){idx=Math.max(0,Math.min(4,i));$('#track').style.transform=`translateX(${-idx*20}%)`;
  document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('on',k===idx));document.querySelectorAll('.panel').forEach((p,k)=>p.classList.toggle('act',k===idx))}
document.addEventListener('touchstart',e=>{x0=(e.target.type==='range')?null:e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)go(idx+(dx<0?1:-1));x0=null});

/* ---------- clock ---------- */
let lastSec=-1;
function tick(){
  const d=new Date();
  setTime(d);greet(d);
  if(d.getSeconds()!==lastSec){lastSec=d.getSeconds();
    $('#date').textContent=d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
    if(lastSec===0){drift();prog(d);nextAlarm();setQuote()}
    checkAlarms(d);checkMoments(d)}
  timerTick();
}
function setTime(d){const s=p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds());
  document.querySelectorAll('#time .dg').forEach((e,i)=>{if(e.textContent===s[i])return;const first=e.textContent==='';e.textContent=s[i];
    if(!first&&i<5){e.classList.remove('roll');void e.offsetWidth;e.classList.add('roll')}})}
function greet(d){const h=d.getHours(),g=h<6?'Nachtbraker':h<12?'Goedemorgen':h<18?'Goedemiddag':'Goedenavond';if($('#greet').textContent!==g)$('#greet').textContent=g}
function prog(d){const e=$('#prog i');e.style.animation='none';void e.offsetWidth;e.style.animation='';e.style.animationDelay=-(d.getSeconds()+d.getMilliseconds()/1000)+'s'}
function drift(){const r=()=>(Math.random()*2-1)*3;$('#drift').style.transform=`translate(${r()}vw,${r()}vh)`}

/* ---------- weather particles ---------- */
const fx=$('#fx'),fc=fx.getContext('2d');let parts=[],kind='',curKind='';
function fxSize(){fx.width=innerWidth/2;fx.height=innerHeight/2}fxSize();addEventListener('resize',fxSize);
function setFx(k){kind=k;parts=[];fc.clearRect(0,0,fx.width,fx.height);
  const n=(k==='rain'||k==='storm')?50:k==='snow'?35:0;if(k==='storm')kind='rain';
  for(let i=0;i<n;i++)parts.push({x:Math.random()*fx.width,y:Math.random()*fx.height,v:kind==='rain'?6+Math.random()*5:.6+Math.random()*1.2,r:1+Math.random()*1.8,ph:Math.random()*6})}
let lt=0;function loop(t){requestAnimationFrame(loop);if(t-lt<50||!parts.length)return;lt=t;fc.clearRect(0,0,fx.width,fx.height);
  fc.fillStyle=fc.strokeStyle=S.light?'rgba(0,0,0,.22)':'rgba(255,255,255,.26)';
  parts.forEach(p=>{p.y+=p.v;if(kind==='snow')p.x+=Math.sin(t/900+p.ph)*.5;else p.x-=1;
    if(p.y>fx.height){p.y=-10;p.x=Math.random()*fx.width}
    fc.beginPath();if(kind==='rain'){fc.moveTo(p.x,p.y);fc.lineTo(p.x+2,p.y-8);fc.stroke()}else{fc.arc(p.x,p.y,p.r,0,6.3);fc.fill()}})}
requestAnimationFrame(loop);

/* ---------- weather ---------- */
const W={0:['sun','Helder'],1:['sun','Overwegend helder'],2:['part','Half bewolkt'],3:['cloud','Bewolkt'],45:['fog','Mist'],48:['fog','Mist'],
 51:['rain','Motregen'],53:['rain','Motregen'],55:['rain','Motregen'],56:['rain','IJzel'],57:['rain','IJzel'],61:['rain','Regen'],63:['rain','Regen'],65:['rain','Zware regen'],
 66:['rain','IJzel'],67:['rain','IJzel'],71:['snow','Sneeuw'],73:['snow','Sneeuw'],75:['snow','Zware sneeuw'],77:['snow','Sneeuw'],
 80:['rain','Buien'],81:['rain','Buien'],82:['rain','Zware buien'],85:['snow','Sneeuwbuien'],86:['snow','Sneeuwbuien'],95:['storm','Onweer'],96:['storm','Onweer'],99:['storm','Onweer']};
const SUN='<g class="sun-r" style="stroke:var(--acc)" stroke-width="3" stroke-linecap="round"><path d="M20 3v6M20 31v6M3 20h6M31 20h6M8 8l4 4M28 28l4 4M32 8l-4 4M12 28l-4 4"/></g><circle cx="20" cy="20" r="8" style="fill:var(--acc)"/>';

  s.buffer=nb;const fl=ctx.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.setValueAtTime(f0,t);fl.frequency.linearRampToValueAtTime(f1,t+dur);fl.Q.value=q;
  const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(ctx.destination);s.start(t);s.stop(t+dur+.05)}
function tone(t,f0,f1,dur,vol,type){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+dur*.3);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+.05)}
const SND={
 yawn(){const t=ctx.currentTime;tone(t,300,520,.8,.13,'triangle');tone(t+.8,520,400,.6,.13,'triangle');tone(t+1.4,400,190,1,.1,'triangle');nz(t,2.4,500,300,.8,.5)},
 munch(){const t=ctx.currentTime;for(let i=0;i<4;i++)nz(t+i*.28,.12,600+Math.random()*500,450,1.2,1.6);tone(t+1.3,2400,2400,.12,.05)},
 crunch(){const t=ctx.currentTime;for(let i=0;i<3;i++)nz(t+i*.2,.09,2800,2000,.7,.6,'highpass')},
 sip(){const t=ctx.currentTime;nz(t,.5,500,1500,3,1.4);tone(t+.7,280,230,.5,.1)},
 lullaby(){const t=ctx.currentTime;[659.25,783.99,880,783.99,659.25,587.33].forEach((f,i)=>tone(t+i*.55,f,f,1.3,.12))}};
let sceneT=null,sndT=[];
const at=(ms,fn)=>sndT.push(setTimeout(()=>{if(ctx){try{ctx.resume();fn()}catch(e){}}},ms));
const rpt=(f,g,n,fn)=>{for(let i=0;i<n;i++)at(f+g*i,fn)};
const MOM={wake:s=>{at(200,()=>beep(.3));at(3700,SND.yawn);at(11200,SND.yawn)},coffee:s=>rpt(1000,3000,5,SND.sip),lunch:s=>rpt(1000,3000,5,SND.munch),
 snack:s=>rpt(1000,3000,5,SND.crunch),dinner:s=>rpt(1000,3000,5,SND.munch),bed:s=>{at(300,SND.yawn);at(3800,SND.lullaby);at(7800,SND.yawn);at(11300,SND.lullaby)}};
function clearScene(){clearTimeout(sceneT);sndT.forEach(clearTimeout);sndT=[]}
function showScene(type,o){o=o||{};clearScene();const el=$('#scene');
  $('#sart').innerHTML=art[type]();$('#stime').textContent=o.time||'';$('#smsg').textContent=o.msg||'';
  el.classList.toggle('hold',!!o.hold);el.classList.add('on');void el.offsetWidth;el.classList.add('show');
  const b=$('#sbar i');b.style.animation='none';void b.offsetWidth;b.style.animation='';
  if(S.msnd&&!o.hold)MOM[type]();
  if(!o.hold)sceneT=setTimeout(hideScene,15000)}
function hideScene(){clearScene();const el=$('#scene');el.classList.remove('show');setTimeout(()=>{if(!el.classList.contains('show'))el.classList.remove('on')},600)}
function tapScene(){if(!$('#scene').classList.contains('hold'))hideScene()}
const fired={};
function checkMoments(d){if(!S.mom||ringT)return;const hm=p2(d.getHours())+':'+p2(d.getMinutes()),key=d.toDateString()+hm;
  EVD.forEach(e=>{const v=getEv(e);if(v.on&&v.t===hm&&fired[e.id]!==key){fired[e.id]=key;showScene(e.type,{time:hm,msg:e.m})}})}

const TG=[['light','Wit thema'],['amb','Achtergrond-gloed'],['fx','Regen- en sneeuwanimatie'],['sec','Seconden tonen'],['wx','Weer tonen'],['bat','Batterij tonen'],['nxt','Volgende wekker tonen'],['quote','Dagelijkse spreuk'],['tap','Tik-geluid'],['mom','Momenten-animaties'],['msnd','Moment-geluid']];
const QU=['Alle begin is moeilijk.','Na regen komt zonneschijn.','Eén dag per keer.','Beter laat dan nooit.','Geduld is een schone zaak.','Even doorbijten.','Rust roest niet.','Kleine stapjes, grote sprongen.','Doe maar gewoon, dan doe je al gek genoeg.','Lachen is gezond.','Morgen is er weer een dag.','Zonder haast, maar zonder rust.','Elke dag een beetje beter.','Wie niet waagt, die niet wint.'];
function setQuote(){const n=new Date();$('#quote').textContent=QU[Math.floor((n-new Date(n.getFullYear(),0,0))/864e5)%QU.length]}
function nextAlarm(){const now=new Date();let best=null;
  S.alarms.forEach(a=>{if(!a.on||!a.d.length)return;const hm=a.t.split(':').map(Number);
    for(let k=0;k<8;k++){const t=new Date(now.getFullYear(),now.getMonth(),now.getDate()+k,hm[0],hm[1],0);if(t>now&&a.d.includes(t.getDay())){if(!best||t<best.t)best={t:t,k:k};break}}});
  $('#nxt').textContent=best?'Wekker '+(best.k===0?'vandaag':best.k===1?'morgen':['zo','ma','di','wo','do','vr','za'][best.t.getDay()])+' '+p2(best.t.getHours())+':'+p2(best.t.getMinutes()):''}
if(navigator.getBattery)navigator.getBattery().then(b=>{const u=()=>{$('#bat').textContent=Math.round(b.level*100)+'%'+(b.charging?' · laden':'')};u();b.onlevelchange=b.onchargingchange=u}).catch(()=>{});
function applyBright(){if(window.KimerNative)try{KimerNative.setBrightness(S.bright>0?S.bright/100:-1)}catch(e){}}
function applySet(){document.documentElement.classList.toggle('light',S.light);const b=document.body.classList;
  b.toggle('noamb',!S.amb);b.toggle('nosec',!S.sec);b.toggle('nowx',!S.wx);b.toggle('nobat',!S.bat);b.toggle('nonxt',!S.nxt);b.toggle('noquote',!S.quote);
  document.querySelector('meta[name=theme-color]').content=S.light?'#ffffff':'#000000';
  applyBright();setFx(S.fx?curKind:'');nextAlarm();setQuote()}
function renderSet(){const box=$('#setbox');
  box.innerHTML='<div class="tgs">'+TG.map(([k,l])=>`<div class="tg" data-k="${k}"><div class="sw ${S[k]?'on':''}"></div>${l}</div>`).join('')+'</div>'+
   (NATIVE?`<div class="br"><span id="bl"></span><input type="range" min="0" max="100" step="5" value="${S.bright}"></div>`:'')+
   '<div class="mh">Momenten</div>'+EVD.map(e=>{const v=getEv(e);return `<div class="mr" data-id="${e.id}"><div class="sw ${v.on?'on':''}"></div><span>${e.l}</span><input type="time" value="${v.t}"><button class="btn">Voorbeeld</button></div>`}).join('');
  box.querySelectorAll('.tg').forEach(t=>t.onclick=()=>{const k=t.dataset.k;S[k]=!S[k];save();applySet();t.querySelector('.sw').classList.toggle('on',S[k])});
  box.querySelectorAll('.mr').forEach(r=>{const e=EVD.find(x=>x.id===r.dataset.id);
    const set=(k,v)=>{S.ev[e.id]=Object.assign({},S.ev[e.id],{[k]:v});save()};
    r.querySelector('.sw').onclick=ev=>{const on=!getEv(e).on;set('on',on);ev.currentTarget.classList.toggle('on',on)};
    r.querySelector('input').onchange=ev=>set('t',ev.target.value);
    r.querySelector('.btn').onclick=()=>{const v=getEv(e);showScene(e.type,{time:v.t,msg:e.m})}});
  const r=box.querySelector('input[type=range]');
  if(r){const lab=()=>{$('#bl').textContent='Helderheid: '+(S.bright>0?S.bright+'%':'systeem')};lab();r.oninput=()=>{S.bright=+r.value;lab();applyBright();save()}}}
renderSet();applySet();
document.querySelector('.panel').classList.add('act');

if(NATIVE)$('#start').style.display='none';
renderAlarms();(function sched(){tick();setTimeout(sched,1000-Date.now()%1000+8)})();
setInterval(()=>{if(T.run||P.run||SW.run)timerTick()},125);drift();prog(new Date());
</script>
